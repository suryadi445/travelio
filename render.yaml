services:
  - type: web
    name: bookhaven-api
    runtime: docker
    plan: free
    rootDir: backend
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: GOOGLE_BOOKS_API_URL
        value: https://www.googleapis.com/books/v1/volumes
      - key: CORS_ORIGIN
        value: '*'
      - key: MONGODB_URI
        sync: false

  - type: web
    name: bookhaven-web
    runtime: static
    plan: free
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          name: bookhaven-api
          type: web
          envVarKey: RENDER_EXTERNAL_URL
